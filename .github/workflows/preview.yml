name: preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PREVIEW_NAME: pr-${{ github.event.pull_request.number }}

jobs:
  deploy:
    # Fork PRs get no secrets, so only same-repo branches are previewed.
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run cf-typegen
      - run: npx wrangler d1 migrations apply DB --remote --preview
      - run: npm run preview:branch -- --name "$PREVIEW_NAME" | tee preview.log
      - name: comment preview url
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(grep -oE "https://${PREVIEW_NAME}-heimdall\.[a-z0-9-]+\.workers\.dev" preview.log | head -1)
          [ -n "$url" ] || exit 0
          gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none \
            --body "Preview: $url"

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx wrangler preview delete --name "$PREVIEW_NAME" || true
